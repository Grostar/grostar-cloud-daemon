name: Recordatorio y Anulación Fútbol 7 (iPhone)

on:
  schedule:
    # Respaldo de comprobación cada 30 min en ventana de partido (además del bucle 20s del daemon 24/7)
    - cron: '5,35 13,14,15,16,17,18,19,20 * * 5'
    - cron: '5,35 20,21,22 * * 6'

  workflow_dispatch:
    inputs:
      accion:
        description: 'Acción a realizar'
        required: true
        default: 'recordatorio'
        type: choice
        options:
          - recordatorio
          - forzar_anulacion

jobs:
  gestionar_confirmacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: recordatorio-partido-futbol7
      cancel-in-progress: false
    permissions:
      actions: read

    steps:
      - name: Clonar repositorio privado de Fútbol 7
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          rm -rf /tmp/futbol7
          for i in 1 2 3; do rm -rf /tmp/futbol7 && git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/Grostar/reservas-futbol7-antequera.git" /tmp/futbol7 && break || sleep 3; done
          mkdir -p /tmp/futbol7

      - name: Comprobar si se requiere acción (Filtro rápido 1s)
        continue-on-error: true
        id: check_needed
        working-directory: /tmp/futbol7
        env:
          TZ: 'Europe/Madrid'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Madrid")
          now = datetime.now(tz)
          ev = os.environ.get("EVENT_NAME", "")
          skip = "false"

          # En modo schedule, omitir horas UTC correspondientes a otra estación (antes de 15:00 viernes o antes de 22:00 sábado)
          if ev == "schedule":
              if (now.weekday() == 4 and now.hour < 15) or (now.weekday() == 5 and now.hour < 22):
                  print(f"Hora previa a ventana de recordatorio ({now.strftime('%H:%M')} Madrid). Omitiendo en 1s.")
                  skip = "true"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SKIP_REMINDER={skip}\n")
          EOF

      - name: Configurar Python
        continue-on-error: true
        if: env.SKIP_REMINDER != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        continue-on-error: true
        if: env.SKIP_REMINDER != 'true'
        run: |
          python -m pip install --upgrade pip -q
          pip install -r /tmp/futbol7/requirements.txt -q
          if [ "${{ github.event.inputs.accion }}" = "forzar_anulacion" ]; then
            playwright install --with-deps chromium >/dev/null 2>&1
          fi

      - name: Procesar Recordatorio / Anulación
        continue-on-error: true
        if: env.SKIP_REMINDER != 'true'
        working-directory: /tmp/futbol7
        env:
          TZ: 'Europe/Madrid'
          CLOUD_DAEMON_24_7: 'false'
          EVENT_NAME: ${{ github.event_name }}
          ACCION: ${{ github.event.inputs.accion || 'recordatorio' }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          CRONOS_PASS_GROSTAR: ${{ secrets.CRONOS_PASS_GROSTAR }}
          CRONOS_PASS_MRJAVI: ${{ secrets.CRONOS_PASS_MRJAVI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.FUTBOL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.FUTBOL_CHAT_ID }}
        run: |
          python3 - << 'EOF'
          import json, os
          if os.path.exists("config.json"):
              try:
                  cfg = json.load(open("config.json", encoding="utf-8"))
                  for r in cfg.get("rutinas", {}).values():
                      for k in ("email", "password", "titular"):
                          val = str(r.get(k, "")).strip()
                          if len(val) >= 4:
                              print(f"::add-mask::{val}")
                  notif = cfg.get("notificaciones", {})
                  for k in ("telegram_token", "telegram_chat_id"):
                      val = str(notif.get(k, "")).strip()
                      if len(val) >= 4:
                          print(f"::add-mask::{val}")
              except Exception:
                  pass
          EOF
          git pull --rebase --autostash origin main || true
          if [ "$ACCION" = "forzar_anulacion" ]; then
            echo "Forzando anulación de reserva..."
            python anular_reserva.py --modo auto
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python notificador_telegram.py --force
          else
            python notificador_telegram.py
          fi

      - name: Actualizar registro de reservas en repositorio privado
        continue-on-error: true
        if: always() && env.SKIP_REMINDER != 'true'
        working-directory: /tmp/futbol7
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GrostarCloudDaemon"
          git add registro_reservas.json screenshots/reserva_anulada*.png 2>/dev/null || git add registro_reservas.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios en el registro de reservas."
          else
            git commit -m "Actualizar estado de reserva [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin main || true
          fi
